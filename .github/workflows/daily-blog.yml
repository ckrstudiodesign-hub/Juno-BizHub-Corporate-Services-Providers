name: Daily Blog Generation

on:
  schedule:
    # Runs daily at 5:00 AM UTC (9:00 AM Dubai time, UTC+4)
    - cron: "0 5 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate blog post (also cleans up expired posts)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-blog.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/generated-posts.json data/used-topics.json
          git diff --staged --quiet || git commit -m "chore: daily blog — generate new post & clean up expired [skip ci]"
          git push
